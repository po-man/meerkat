version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=4000
      - PHX_SERVER=true
      - PHX_HOST=${PHX_HOST:-qa.example.com}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-generate_with_mix_phx_gen_secret}
      - DATABASE_PATH=/app/data/prod.sqlite3
      - ADMIN_ACCESS_CODE=${ADMIN_ACCESS_CODE:-secret123}
    volumes:
      - sqlite_data:/app/data
    expose:
      - "4000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  sqlite_data:
