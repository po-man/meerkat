name: Release (Gigalixir)

# Tag a commit on main to ship it to the free-tier Gigalixir app:
#
#   git tag rel.gigalixir.2026.11.02.1 && git push origin rel.gigalixir.2026.11.02.1
#
# Secrets: GIGALIXIR_APP_NAME, GIGALIXIR_EMAIL, GIGALIXIR_API_KEY, and
# optionally ADMIN_ACCESS_CODE (synced to the app). Optional variable: PHX_HOST.
#
# To roll back, run this workflow manually (workflow_dispatch) with a previous
# `rel.gigalixir.*` tag. Gigalixir's app itself can also be rolled back with
# `gigalixir releases:rollback`, which needs no rebuild.

on:
  push:
    tags:
      - "rel.gigalixir.*"
  workflow_dispatch:
    inputs:
      ref:
        description: Existing rel.gigalixir.* tag to deploy
        required: true
        type: string

# Never run two Gigalixir deploys at once, and never cancel one midway.
concurrency:
  group: gigalixir
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy_ref: ${{ steps.ref.outputs.deploy_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Validate tag and origin
        id: ref
        env:
          REQUESTED_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -eu

          if ! printf '%s' "$REQUESTED_REF" | grep -Eq '^rel\.gigalixir\.[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[A-Za-z0-9._-]+$'; then
            echo "::error::'$REQUESTED_REF' does not match rel.gigalixir.YYYY.MM.DD.X"
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse HEAD) is not an ancestor of main; tag releases from main"
            exit 1
          fi

          echo "deploy_ref=$REQUESTED_REF" >> "$GITHUB_OUTPUT"
          echo "### Deploying \`$REQUESTED_REF\` to Gigalixir" >> "$GITHUB_STEP_SUMMARY"

  # Same job that runs on every PR: a tag can never ship untested code.
  test:
    name: test
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      build_docker: false

  deploy:
    name: deploy
    needs: [verify, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: gigalixir
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.deploy_ref }}

      # Runtime config lives on the app; GitHub secrets do not reach it. Sync
      # the values managed here, then fail before pushing if anything required
      # is still missing.
      - name: Sync and check app config
        env:
          GIGALIXIR_EMAIL: ${{ secrets.GIGALIXIR_EMAIL }}
          GIGALIXIR_API_KEY: ${{ secrets.GIGALIXIR_API_KEY }}
          GIGALIXIR_APP_NAME: ${{ secrets.GIGALIXIR_APP_NAME }}
          ADMIN_ACCESS_CODE: ${{ secrets.ADMIN_ACCESS_CODE }}
          PHX_HOST: ${{ vars.PHX_HOST }}
        run: |
          set -eu

          APP=$(printf '%s' "$GIGALIXIR_APP_NAME" | tr -d '[:space:]')
          EMAIL=$(printf '%s' "$GIGALIXIR_EMAIL" | tr -d '[:space:]')
          API_KEY=$(printf '%s' "$GIGALIXIR_API_KEY" | tr -d '[:space:]')
          : "${APP:?missing GIGALIXIR_APP_NAME secret}"
          : "${EMAIL:?missing GIGALIXIR_EMAIL secret}"
          : "${API_KEY:?missing GIGALIXIR_API_KEY secret}"

          curl -fsSL https://get.gigalixir.com/cli | bash >/dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          # The CLI logs in with the raw email; the push below uses the
          # URI-encoded form. Accept either form in the secret.
          RAW_EMAIL=$(EMAIL="$EMAIL" python3 -c 'import os, urllib.parse; print(urllib.parse.unquote(os.environ["EMAIL"]))')
          printf 'machine api.gigalixir.com\n  login %s\n  password %s\n' "$RAW_EMAIL" "$API_KEY" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

          CONFIG=$(gigalixir config -a "$APP")
          CURRENT_CODE=$(jq -r '.ADMIN_ACCESS_CODE // empty' <<< "$CONFIG")
          CURRENT_HOST=$(jq -r '.PHX_HOST // empty' <<< "$CONFIG")
          CURRENT_POOL=$(jq -r '.POOL_SIZE // "0"' <<< "$CONFIG")

          # PHX_HOST: an explicit repository variable wins, otherwise keep an
          # existing value, otherwise fall back to the default Gigalixir domain.
          HOST="${PHX_HOST:-}"
          if [ -n "$HOST" ]; then
            HOST="${HOST#https://}"
            HOST="${HOST#http://}"
            HOST="${HOST%/}"
          elif [ -z "$CURRENT_HOST" ]; then
            HOST="${APP}.gigalixirapp.com"
          fi

          # Only set what actually differs, so deploys do not restart the app
          # for no reason.
          ASSIGNMENTS=()
          if [ -n "${ADMIN_ACCESS_CODE:-}" ] && [ "$ADMIN_ACCESS_CODE" != "$CURRENT_CODE" ]; then
            ASSIGNMENTS+=("ADMIN_ACCESS_CODE=$ADMIN_ACCESS_CODE")
          fi
          if [ -n "$HOST" ] && [ "$HOST" != "$CURRENT_HOST" ]; then
            ASSIGNMENTS+=("PHX_HOST=$HOST")
          fi
          if [ "$CURRENT_POOL" -lt 2 ]; then
            ASSIGNMENTS+=("POOL_SIZE=2")
          fi

          if [ ${#ASSIGNMENTS[@]} -gt 0 ]; then
            gigalixir config:set "${ASSIGNMENTS[@]}" -a "$APP"
            CONFIG=$(gigalixir config -a "$APP")
          else
            echo "app config already up to date"
          fi

          missing=0
          for key in ADMIN_ACCESS_CODE PHX_HOST DATABASE_URL; do
            if ! jq -e --arg k "$key" 'has($k) and (.[$k] | length > 0)' <<< "$CONFIG" >/dev/null; then
              case "$key" in
                ADMIN_ACCESS_CODE)
                  hint="add the ADMIN_ACCESS_CODE GitHub secret, or run: gigalixir config:set ADMIN_ACCESS_CODE=... -a $APP"
                  ;;
                PHX_HOST)
                  hint="set the PHX_HOST repository variable, or run: gigalixir config:set PHX_HOST=$APP.gigalixirapp.com -a $APP"
                  ;;
                DATABASE_URL)
                  hint="create the free database with: gigalixir pg:create --free -a $APP"
                  ;;
              esac
              echo "::error::Gigalixir app '$APP' is missing $key. $hint"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

          POOL=$(jq -r '.POOL_SIZE // "2"' <<< "$CONFIG")
          if [ "$POOL" -lt 2 ]; then
            echo "::error::POOL_SIZE=$POOL. Ecto migrations need at least 2 connections. Run: gigalixir config:set POOL_SIZE=2 -a $APP"
            exit 1
          fi

      # Deploys are a normal git push. The API key is the password and the
      # email must be URI-encoded in the URL. Migrations run at boot from
      # rel/overlays/Procfile; the free tier has no SSH for ps:migrate.
      - name: Push to Gigalixir
        env:
          GIGALIXIR_EMAIL: ${{ secrets.GIGALIXIR_EMAIL }}
          GIGALIXIR_API_KEY: ${{ secrets.GIGALIXIR_API_KEY }}
          GIGALIXIR_APP_NAME: ${{ secrets.GIGALIXIR_APP_NAME }}
        run: |
          set -eu
          APP=$(printf '%s' "$GIGALIXIR_APP_NAME" | tr -d '[:space:]')
          EMAIL=$(printf '%s' "$GIGALIXIR_EMAIL" | tr -d '[:space:]')
          API_KEY=$(printf '%s' "$GIGALIXIR_API_KEY" | tr -d '[:space:]')
          : "${APP:?missing GIGALIXIR_APP_NAME secret}"
          : "${EMAIL:?missing GIGALIXIR_EMAIL secret}"
          : "${API_KEY:?missing GIGALIXIR_API_KEY secret}"

          RAW_EMAIL=$(EMAIL="$EMAIL" python3 -c 'import os, urllib.parse; print(urllib.parse.unquote(os.environ["EMAIL"]))')
          ENCODED_EMAIL=$(printf '%s' "$RAW_EMAIL" | jq -sRr @uri)
          git remote add gigalixir "https://${ENCODED_EMAIL}:${API_KEY}@git.gigalixir.com/${APP}.git"
          git push --force gigalixir HEAD:refs/heads/main

      - name: Scale to one replica
        env:
          GIGALIXIR_APP_NAME: ${{ secrets.GIGALIXIR_APP_NAME }}
        run: |
          set -eu
          APP=$(printf '%s' "$GIGALIXIR_APP_NAME" | tr -d '[:space:]')
          : "${APP:?missing GIGALIXIR_APP_NAME secret}"

          # A brand-new app has no release yet, so ps:scale fails until the
          # first build finishes. Retry while the deploy is rolling out.
          # One replica is required: PubSub, Presence and VoteStore are
          # in-process. The free tier's largest replica is 0.5.
          for i in $(seq 1 120); do
            if gigalixir ps:scale --replicas=1 --size=0.5 -a "$APP"; then
              exit 0
            fi
            sleep 5
          done

          echo "::error::could not scale $APP; check 'gigalixir ps -a $APP'"
          exit 1

      - name: Wait for the app to become healthy
        env:
          GIGALIXIR_APP_NAME: ${{ secrets.GIGALIXIR_APP_NAME }}
        run: |
          set -eu
          APP=$(printf '%s' "$GIGALIXIR_APP_NAME" | tr -d '[:space:]')
          URL="https://${APP}.gigalixirapp.com/healthz"

          # Gigalixir's default ingress answers 200 with an empty body when the
          # app has no running pods. Check the body, not just the status.
          for i in $(seq 1 60); do
            if curl -fsS "$URL" 2>/dev/null | grep -qx 'ok'; then
              echo "healthy after ~$((i * 10))s"
              echo "### Deployed: https://${APP}.gigalixirapp.com" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done

          echo "::error::app did not become healthy at $URL (see 'gigalixir logs -a $APP')"
          exit 1
