name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by the release workflow so a tag can never ship untested code.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: mix precommit
    runs-on: ubuntu-24.04-arm
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Audit dependencies
        run: mix hex.audit

      - name: Compile, format check and test
        run: mix precommit

      # `mix precommit` formats and unlocks deps in place, so any change here
      # means the branch is not clean: fail instead of silently fixing it.
      - name: Verify precommit changed nothing
        run: git diff --exit-code

  docker:
    name: docker build
    runs-on: ubuntu-24.04-arm
    # Releases build (and push) the image themselves, so skip it when called.
    if: github.event_name != 'workflow_call'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=meerkat
          cache-to: type=gha,mode=max,scope=meerkat
